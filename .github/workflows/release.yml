name: release

# v1.2.3 のようなタグを push すると、自己完結・単一ファイルの exe をビルドして Release に添付する。
# 手動実行（workflow_dispatch）ではビルドしてアーティファクトを残すだけで Release は作らない。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # 直前のタグを探して差分リンクを作るため、履歴を全部取る
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: バージョンをタグから決める
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset=KenketsuAvailability-v$v-win-x64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 単一 exe を発行
        shell: pwsh
        run: dotnet publish KenketsuAvailability/KenketsuAvailability.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: 成果物を配布名にする
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/KenketsuAvailability.exe "dist/${{ steps.ver.outputs.asset }}"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: KenketsuAvailability-win-x64
          path: dist/*.exe

      - name: リリースノートを組み立てる
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $asset   = '${{ steps.ver.outputs.asset }}'
          $tag     = '${{ github.ref_name }}'
          $repo    = '${{ github.repository }}'
          $url     = "https://github.com/$repo/releases/download/$tag/$asset"

          # CHANGELOG.md から「## vX.Y.Z」の節を、次の「## v」の直前まで抜き出す
          $section = ''
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $pattern = '(?ms)^##\s+v' + [regex]::Escape($version) + '\s*$(.*?)(?=^##\s+v|\z)'
            $match = [regex]::Match($raw, $pattern)
            if ($match.Success) { $section = $match.Groups[1].Value.Trim() }
          }
          if ($section -eq '') {
            Write-Host "::warning::CHANGELOG.md に v$version の節が見つかりませんでした"
            $section = '（変更点の記載がありません）'
          }

          # 直前のタグがあれば差分ページへのリンクを添える
          $compare = ''
          $prev = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ($prev) { $compare = "**Full Changelog**: https://github.com/$repo/compare/$prev...$tag" }

          $notes = (Get-Content .github/release-notes.md -Raw).
            Replace('{{VERSION}}', $version).
            Replace('{{ASSET}}', $asset).
            Replace('{{URL}}', $url).
            Replace('{{CHANGELOG}}', $section).
            Replace('{{COMPARE}}', $compare)
          Set-Content -Path release-notes-built.md -Value $notes -Encoding utf8
          Write-Host '--- 組み立てたリリースノート ---'
          Write-Host $notes

      - name: Release を作成
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "dist/${{ steps.ver.outputs.asset }}" --title '${{ github.ref_name }}' --notes-file release-notes-built.md
