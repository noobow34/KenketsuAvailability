name: release

# v1.2.3 のようなタグを push すると、自己完結・単一ファイルの exe をビルドして Release に添付する。
# 手動実行（workflow_dispatch）ではビルドしてアーティファクトを残すだけで Release は作らない。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: バージョンをタグから決める
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "asset=KenketsuAvailability-v$v-win-x64.exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 単一 exe を発行
        shell: pwsh
        run: dotnet publish KenketsuAvailability/KenketsuAvailability.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: 成果物を配布名にする
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/KenketsuAvailability.exe "dist/${{ steps.ver.outputs.asset }}"
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: KenketsuAvailability-win-x64
          path: dist/*.exe

      - name: Release を作成
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' "dist/${{ steps.ver.outputs.asset }}" --title '${{ github.ref_name }}' --notes-file .github/release-notes.md
